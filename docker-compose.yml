services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cursit
      POSTGRES_PASSWORD: cursit123
      POSTGRES_DB: cursit
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cursit']
      interval: 5s
      timeout: 3s
      retries: 10

  db-viewer:
    image: dbgate/dbgate:7.0.6-alpine
    ports:
      - 8081:3000
    environment:
      CONNECTIONS: con1
      LABEL_con1: Cursit PostgreSQL
      SERVER_con1: db
      USER_con1: cursit
      PASSWORD_con1: cursit123
      PORT_con1: 5432
      ENGINE_con1: postgres@dbgate-plugin-postgres
      DATABASE_con1: cursit
      SINGLE_CONNECTION: con1
    depends_on:
      - db

  minio:
    image: minio/minio:latest
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: cursit
      MINIO_ROOT_PASSWORD: cursit123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  minio_data:
